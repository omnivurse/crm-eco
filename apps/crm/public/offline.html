<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | Double Helix Hub</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    :root {
      --bg-light: #ffffff;
      --bg-dark: #0f172a;
      --text-light: #0f172a;
      --text-dark: #f8fafc;
      --muted-light: #64748b;
      --muted-dark: #94a3b8;
      --card-light: #ffffff;
      --card-dark: #1e293b;
      --accent: #3b82f6;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      transition: background-color 0.3s, color 0.3s;
    }
    
    /* Light mode (default) */
    body {
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      color: var(--text-light);
    }
    
    /* Dark mode */
    body.dark {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: var(--text-dark);
    }
    
    .container {
      background: var(--card-light);
      border-radius: 16px;
      padding: 48px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
    }
    
    body.dark .container {
      background: var(--card-dark);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
    }
    
    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 24px;
    }
    
    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      background: #f1f5f9;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    body.dark .icon {
      background: #334155;
    }
    
    .icon svg {
      width: 40px;
      height: 40px;
      color: #64748b;
    }
    
    body.dark .icon svg {
      color: #94a3b8;
    }
    
    h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    
    p {
      color: var(--muted-light);
      line-height: 1.6;
      margin-bottom: 24px;
    }
    
    body.dark p {
      color: var(--muted-dark);
    }
    
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 14px 32px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    
    button:hover {
      background: #2563eb;
    }
    
    button:active {
      transform: scale(0.98);
    }
    
    .secondary-btn {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
    }
    
    .secondary-btn:hover {
      background: rgba(59, 130, 246, 0.1);
    }
    
    .status {
      margin-top: 24px;
      padding: 12px 16px;
      background: #fef3c7;
      border-radius: 8px;
      color: #92400e;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    body.dark .status {
      background: #422006;
      color: #fcd34d;
    }
    
    .status-dot {
      width: 8px;
      height: 8px;
      background: #f59e0b;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    .cached-pages {
      margin-top: 24px;
      text-align: left;
    }
    
    .cached-pages h3 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--muted-light);
    }
    
    body.dark .cached-pages h3 {
      color: var(--muted-dark);
    }
    
    .cached-pages ul {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    
    .cached-pages a {
      display: inline-block;
      padding: 6px 12px;
      background: #f1f5f9;
      color: var(--text-light);
      text-decoration: none;
      border-radius: 6px;
      font-size: 13px;
      transition: background 0.2s;
    }
    
    body.dark .cached-pages a {
      background: #334155;
      color: var(--text-dark);
    }
    
    .cached-pages a:hover {
      background: #e2e8f0;
    }
    
    body.dark .cached-pages a:hover {
      background: #475569;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071c3.904-3.905 10.236-3.905 14.141 0M1.394 9.393c5.857-5.857 15.355-5.857 21.213 0" />
      </svg>
    </div>
    <h1>You're Offline</h1>
    <p>Can't connect to the server. Check your internet connection and try again.</p>
    
    <div class="actions">
      <button onclick="window.location.reload()">Try Again</button>
      <button class="secondary-btn" onclick="goToDashboard()">Go to Dashboard</button>
    </div>
    
    <div class="status">
      <span class="status-dot"></span>
      Waiting for connection...
    </div>
    
    <div class="cached-pages" id="cachedPages" style="display: none;">
      <h3>Available Offline:</h3>
      <ul id="cachedList"></ul>
    </div>
  </div>
  
  <script>
    // Detect theme preference
    (function() {
      try {
        var theme = localStorage.getItem('crm-theme') || 'light';
        var resolved = theme === 'system'
          ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : theme;
        if (resolved === 'dark') {
          document.body.classList.add('dark');
        }
      } catch (e) {}
    })();
    
    // Check if we're back online
    window.addEventListener('online', () => {
      window.location.reload();
    });
    
    // Go to dashboard (may be cached)
    function goToDashboard() {
      window.location.href = '/dashboard';
    }
    
    // Show cached pages if available
    if ('caches' in window) {
      caches.open('dhh-v1').then(cache => {
        cache.keys().then(keys => {
          const pages = keys
            .filter(req => req.url.includes(location.origin) && !req.url.includes('.'))
            .map(req => new URL(req.url).pathname)
            .filter((v, i, a) => a.indexOf(v) === i);
          
          if (pages.length > 0) {
            document.getElementById('cachedPages').style.display = 'block';
            const list = document.getElementById('cachedList');
            pages.forEach(page => {
              const li = document.createElement('li');
              const a = document.createElement('a');
              a.href = page;
              a.textContent = page === '/' ? 'Home' : page.replace(/^\//, '').replace(/-/g, ' ');
              li.appendChild(a);
              list.appendChild(li);
            });
          }
        });
      });
    }
  </script>
</body>
</html>
