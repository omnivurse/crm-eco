<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | Double Helix Hub</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    :root {
      --bg-light: #ffffff;
      --bg-dark: #0f172a;
      --text-light: #0f172a;
      --text-dark: #f8fafc;
      --muted-light: #64748b;
      --muted-dark: #94a3b8;
      --card-light: #ffffff;
      --card-dark: #1e293b;
      --accent: #3b82f6;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      transition: background-color 0.3s, color 0.3s;
    }
    
    /* Light mode (default) */
    body {
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      color: var(--text-light);
    }
    
    /* Dark mode */
    body.dark {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: var(--text-dark);
    }
    
    .container {
      background: var(--card-light);
      border-radius: 16px;
      padding: 48px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
    }
    
    body.dark .container {
      background: var(--card-dark);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
    }
    
    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 24px;
    }
    
    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      background: #f1f5f9;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    body.dark .icon {
      background: #334155;
    }
    
    .icon svg {
      width: 40px;
      height: 40px;
      color: #64748b;
    }
    
    body.dark .icon svg {
      color: #94a3b8;
    }
    
    h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    
    p {
      color: var(--muted-light);
      line-height: 1.6;
      margin-bottom: 24px;
    }
    
    body.dark p {
      color: var(--muted-dark);
    }
    
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 14px 32px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    
    button:hover {
      background: #2563eb;
    }
    
    button:active {
      transform: scale(0.98);
    }
    
    .secondary-btn {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
    }
    
    .secondary-btn:hover {
      background: rgba(59, 130, 246, 0.1);
    }
    
    .status {
      margin-top: 24px;
      padding: 12px 16px;
      background: #fef3c7;
      border-radius: 8px;
      color: #92400e;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    body.dark .status {
      background: #422006;
      color: #fcd34d;
    }
    
    .status-dot {
      width: 8px;
      height: 8px;
      background: #f59e0b;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    .cached-pages {
      margin-top: 24px;
      text-align: left;
    }
    
    .cached-pages h3 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--muted-light);
    }
    
    body.dark .cached-pages h3 {
      color: var(--muted-dark);
    }
    
    .cached-pages ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .cached-pages a {
      display: block;
      padding: 8px 12px;
      background: #f1f5f9;
      color: var(--text-light);
      text-decoration: none;
      border-radius: 6px;
      font-size: 13px;
      transition: background 0.2s;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    
    body.dark .cached-pages a {
      background: #334155;
      color: var(--text-dark);
    }
    
    .cached-pages a:hover {
      background: #e2e8f0;
    }
    
    body.dark .cached-pages a:hover {
      background: #475569;
    }
  </style>
</head>
<body>
  <div class="container">
    <img class="logo" src="/logo-icon.png" alt="Double Helix Hub" width="64" height="64">
    <div class="icon">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071c3.904-3.905 10.236-3.905 14.141 0M1.394 9.393c5.857-5.857 15.355-5.857 21.213 0" />
      </svg>
    </div>
    <h1>You're Offline</h1>
    <p>Can't connect to the server. Check your internet connection and try again.</p>
    
    <div class="actions">
      <button onclick="window.location.reload()">Try Again</button>
      <button class="secondary-btn" onclick="goToDashboard()">Go to Dashboard</button>
    </div>
    
    <div class="status">
      <span class="status-dot"></span>
      Waiting for connection...
    </div>
    
    <div class="cached-pages" id="cachedPages" style="display: none;">
      <h3>Available Offline:</h3>
      <ul id="cachedList"></ul>
    </div>
  </div>
  
  <script>
    // Detect theme preference
    (function() {
      try {
        var theme = localStorage.getItem('crm-theme') || 'light';
        var resolved = theme === 'system'
          ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : theme;
        if (resolved === 'dark') {
          document.body.classList.add('dark');
        }
      } catch (e) {}
    })();

    // Auto-reload the moment we come back online so the user lands
    // on their intended page instead of the offline shell.
    window.addEventListener('online', () => {
      window.location.reload();
    });

    function goToDashboard() {
      window.location.href = '/crm';
    }

    // ------------------------------------------------------------
    // Pending-writes surface: read the mutation queue out of
    // localStorage (same storage key as lib/offline/mutation-queue.ts)
    // so the user sees the count of edits waiting to sync even from
    // the offline shell.
    // ------------------------------------------------------------
    (function renderPendingCount() {
      try {
        var raw = localStorage.getItem('crm.mutationQueue.v1');
        if (!raw) return;
        var list = JSON.parse(raw);
        if (!Array.isArray(list)) return;
        var pending = list.filter(function (m) {
          return m && m.status !== 'succeeded';
        }).length;
        if (pending === 0) return;
        var status = document.querySelector('.status');
        if (!status) return;
        status.innerHTML =
          '<span class="status-dot"></span>' + pending +
          ' change' + (pending === 1 ? '' : 's') +
          ' waiting to sync when you reconnect';
      } catch (e) {
        /* best-effort */
      }
    })();

    // ------------------------------------------------------------
    // Recent-records list: read the `recentRecords` object store from
    // the same IDB database (`crm.responseCache`) that the in-app
    // code writes to on every record visit. Shape contract must stay
    // in sync with lib/offline/recent-records.ts — this script is
    // intentionally vanilla so it works before Next.js hydrates.
    // ------------------------------------------------------------
    (function renderRecentRecords() {
      if (!('indexedDB' in window)) return;
      try {
        var req = indexedDB.open('crm.responseCache', 2);
        req.onsuccess = function () {
          var db = req.result;
          if (!db.objectStoreNames.contains('recentRecords')) return;
          var tx = db.transaction('recentRecords', 'readonly');
          var store = tx.objectStore('recentRecords');
          var all = store.getAll();
          all.onsuccess = function () {
            var rows = (all.result || []).slice();
            rows.sort(function (a, b) { return (b.viewedAt || 0) - (a.viewedAt || 0); });
            if (rows.length === 0) return;
            var panel = document.getElementById('cachedPages');
            var list = document.getElementById('cachedList');
            if (!panel || !list) return;
            panel.style.display = 'block';
            var header = panel.querySelector('h3');
            if (header) header.textContent = 'Recent records (available offline):';
            rows.slice(0, 10).forEach(function (r) {
              var li = document.createElement('li');
              var a = document.createElement('a');
              a.href = '/crm/r/' + r.id;
              a.textContent = r.title || 'Untitled record';
              if (r.subtitle) {
                var span = document.createElement('span');
                span.style.marginLeft = '6px';
                span.style.opacity = '0.65';
                span.style.fontSize = '12px';
                span.textContent = '· ' + r.subtitle;
                a.appendChild(span);
              }
              li.appendChild(a);
              list.appendChild(li);
            });
          };
        };
        req.onerror = function () { /* swallow */ };
      } catch (e) {
        /* swallow */
      }
    })();
  </script>
</body>
</html>
