# Supabase CLI config
[api]
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[auth]
enabled = true
site_url = "https://crm.doublehelixhub.com"
additional_redirect_urls = [
  # Production domains
  "https://crm.doublehelixhub.com/**",
  "https://admin.doublehelixhub.com/**",
  "https://members.doublehelixhub.com/**",
  "https://advisors.doublehelixhub.com/**",
  "https://doublehelixhub.com/**",
  # Tenant (PIFH) white-label domains — member portal invites redirect here
  # (NEXT_PUBLIC_PORTAL_URL = https://members.payitforwardhealth.com)
  "https://crm.payitforwardhealth.com/**",
  "https://admin.payitforwardhealth.com/**",
  "https://members.payitforwardhealth.com/**",
  "https://advisors.payitforwardhealth.com/**",
  "https://payitforwardhealth.com/**",
  # Local development
  "http://localhost:3000/**",
  "http://localhost:3001/**",
  "http://localhost:3002/**",
  "http://localhost:3003/**",
]
jwt_expiry = 3600
enable_signup = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[auth.email.template.confirmation]
subject = "Confirm your email — Double Helix Hub"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your password — Double Helix Hub"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.invite]
subject = "You've been invited to Double Helix Hub"
content_path = "./supabase/templates/invite.html"

[auth.email.template.magic_link]
subject = "Your sign-in link — Double Helix Hub"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.email_change]
subject = "Confirm your email change — Double Helix Hub"
content_path = "./supabase/templates/email_change.html"

# Inbound email webhook (Resend -> unified inbox).
#
# Resend signs deliveries with Svix headers and sends no Authorization header,
# so the default JWT gate rejects every delivery at the platform edge with
# UNAUTHORIZED_NO_AUTH_HEADER and the function never runs. Turning the gate off
# is what allows the function's own signature verification to execute.
#
# This does NOT make the endpoint open: email-intake fails closed unless the
# Svix signature validates against RESEND_INBOUND_WEBHOOK_SECRET (or the legacy
# RESEND_WEBHOOK_SECRET), or the caller presents the service-role bearer token.
# The secret MUST be configured before disabling the gate, or inbound mail is
# rejected by the function instead.
[functions.email-intake]
verify_jwt = false
