# Supabase CLI config
[api]
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[auth]
enabled = true
site_url = "https://crm.payitforwardhealth.com"
additional_redirect_urls = [
  # Production domains
  "https://crm.payitforwardhealth.com/**",
  "https://admin.payitforwardhealth.com/**",
  "https://members.payitforwardhealth.com/**",
  "https://advisors.payitforwardhealth.com/**",
  "https://payitforwardhealth.com/**",
  # Local development
  "http://localhost:3000/**",
  "http://localhost:3001/**",
  "http://localhost:3002/**",
  "http://localhost:3003/**",
]
jwt_expiry = 3600
enable_signup = false

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true

[auth.email.template.confirmation]
subject = "Confirm your email — Pay It Forward Health"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your password — Pay It Forward Health"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.invite]
subject = "You've been invited to Pay It Forward Health"
content_path = "./supabase/templates/invite.html"

[auth.email.template.magic_link]
subject = "Your sign-in link — Pay It Forward Health"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.email_change]
subject = "Confirm your email change — Pay It Forward Health"
content_path = "./supabase/templates/email_change.html"

